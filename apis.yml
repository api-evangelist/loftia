name: Loftia
description: Loftia is a cozy, solarpunk massively-multiplayer online (MMO) game developed
  by Qloud Games Pty Ltd, a remote-first indie studio founded in 2022 and headquartered
  in Sydney, Australia. Set across floating islands in a warm, sustainable world, players
  farm, craft, decorate, socialize, and build a life in the sky alongside friends in a
  shared world that grows over time. The studio (founded by Eric Mallon, Martina Qin, and
  Michael Su) raised a $5M seed round led by BITKRAFT Ventures and GFR Fund with
  participation from Andreessen Horowitz (a16z), and took part in a16z's SPEEDRUN gaming
  accelerator. Loftia is a consumer game company with no public developer API surface as
  of this enrichment pass.
